<head>

<title>ReMedi Henry Ford Go-Live Tracker</title>
<style>
:root{--navy:#0B1121;--navy-light:#111B2E;--teal:#0EA5E9;--teal-dim:rgba(14,165,233,0.15);--teal-border:rgba(14,165,233,0.25);--orange:#F26522;--orange-dim:rgba(242,101,34,0.15);--orange-border:rgba(242,101,34,0.3);--green:#22c55e;--red:#ef4444;--yellow:#fbbf24;--purple:#a855f7;--text:#e8eaf0;--muted:#94a3b8;--subtle:#64748b;--card-bg:rgba(255,255,255,0.025);--card-border:rgba(255,255,255,0.05);--hover-bg:rgba(255,255,255,0.04);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--navy);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;overflow-x:hidden;}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 0%,rgba(14,165,233,0.08) 0%,transparent 60%);pointer-events:none;z-index:0;}
.app{position:relative;z-index:1;padding-bottom:40px;}
.header{padding:20px 20px 12px;background:linear-gradient(180deg,rgba(14,165,233,0.12) 0%,transparent 100%);padding-top:max(20px,env(safe-area-inset-top));}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.brand-sub{font-size:11px;font-weight:600;letter-spacing:2px;color:var(--orange);text-transform:uppercase;}
.brand-title{font-size:22px;font-weight:700;letter-spacing:-0.5px;color:#fff;}
.stat-box{background:var(--orange-dim);border-radius:12px;padding:8px 14px;border:1px solid var(--orange-border);text-align:center;cursor:pointer;}
.stat-box:active{background:rgba(242,101,34,0.25);}
.stat-num{font-size:22px;font-weight:700;color:var(--orange);}
.stat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;}
.sync-ok{background:var(--green);}.sync-err{background:var(--red);}.sync-load{background:var(--yellow);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.date-scroll{display:flex;gap:6px;padding:0 20px 14px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.date-scroll::-webkit-scrollbar{display:none;}
.date-btn{flex-shrink:0;width:44px;padding:8px 0;border-radius:12px;background:var(--hover-bg);border:1px solid rgba(255,255,255,0.06);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all 0.15s ease;}
.date-btn.active{background:var(--orange);border-color:var(--orange);color:#fff;}
.date-btn .day{font-size:10px;font-weight:500;opacity:0.7;}
.date-btn .num{font-size:16px;font-weight:500;}
.date-btn.active .num{font-weight:700;}
.site-scroll{display:flex;gap:6px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.site-scroll::-webkit-scrollbar{display:none;}
.site-btn{flex-shrink:0;padding:9px 14px;border-radius:10px;background:var(--hover-bg);border:1px solid rgba(255,255,255,0.06);color:var(--subtle);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s ease;white-space:nowrap;}
.site-btn.active{background:var(--teal-dim);border-color:var(--teal-border);color:var(--teal);}
.controls-row{padding:0 20px 14px;display:flex;gap:8px;align-items:center;}
.toggle-group{display:flex;background:var(--hover-bg);border-radius:8px;border:1px solid rgba(255,255,255,0.06);overflow:hidden;}
.toggle-btn{padding:7px 14px;background:transparent;border:none;color:var(--subtle);font-size:12px;font-weight:600;cursor:pointer;}
.toggle-btn.active{background:var(--teal-dim);color:var(--teal);}
.shift-group{margin-left:auto;}
.shift-group .toggle-btn{padding:7px 10px;}
.content{padding:0 20px;}
.content-label{font-size:12px;color:var(--subtle);margin-bottom:12px;font-weight:500;}
.empty-state{text-align:center;padding:40px;color:var(--subtle);background:var(--card-bg);border-radius:16px;border:1px solid var(--card-border);}
.empty-icon{font-size:36px;margin-bottom:12px;}
.empty-title{font-size:14px;font-weight:500;}
.unit-list{display:flex;flex-direction:column;gap:8px;}
.unit-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;overflow:hidden;}
.unit-card.open{background:rgba(14,165,233,0.04);border-color:rgba(14,165,233,0.12);}
.unit-header{width:100%;padding:14px 16px;display:flex;align-items:center;background:none;border:none;color:var(--text);cursor:pointer;gap:12px;text-align:left;font-family:inherit;}
.unit-icon{font-size:22px;flex-shrink:0;}
.unit-info{flex:1;min-width:0;}
.unit-name{font-size:14px;font-weight:600;line-height:1.3;}
.unit-meta{font-size:11px;color:var(--subtle);margin-top:2px;}
.unit-arrow{font-size:14px;color:var(--subtle);transition:transform 0.2s;}
.unit-card.open .unit-arrow{transform:rotate(90deg);}
.unit-body{padding:0 16px 14px;}
.shift-section{margin-top:8px;}
.shift-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.shift-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
.shift-label.day{color:var(--orange);}
.shift-label.night{color:#818cf8;}
.shift-time{font-size:10px;color:var(--subtle);background:var(--hover-bg);padding:2px 8px;border-radius:6px;}
.person-row{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:4px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.04);cursor:pointer;position:relative;}
.person-row.st-present{border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.08);}
.person-row.st-missing{border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.08);opacity:0.7;}
.person-row.st-left{border-color:rgba(251,191,36,0.3);background:rgba(251,191,36,0.08);opacity:0.8;}
.person-row.st-removed{opacity:0.3;text-decoration:line-through;}
.person-row.st-swapped{border-color:rgba(168,85,247,0.3);background:rgba(168,85,247,0.08);opacity:0.5;text-decoration:line-through;}
.person-row.replacement{border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.06);border-style:dashed;}
.person-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.person-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.person-note{font-size:10px;margin-top:1px;}
.person-note.swap-tag{color:var(--purple);}
.person-note.rep-tag{color:var(--green);}
.person-note.phone-tag{color:var(--teal);}
.person-note.hotel-tag{color:var(--muted);}
.status-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:0.5px;margin-left:auto;flex-shrink:0;}
.status-badge.present{background:rgba(34,197,94,0.2);color:var(--green);}
.status-badge.missing{background:rgba(239,68,68,0.2);color:var(--red);}
.status-badge.left{background:rgba(251,191,36,0.2);color:var(--yellow);}
.status-badge.removed{background:rgba(100,116,139,0.2);color:var(--subtle);}
.status-badge.swapped{background:rgba(168,85,247,0.2);color:var(--purple);}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--navy-light);border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;}
.modal-name{font-size:18px;font-weight:700;margin-bottom:4px;}
.modal-info{font-size:12px;color:var(--subtle);margin-bottom:12px;}
.modal-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.modal-phone{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--orange-dim);border:1px solid var(--orange-border);border-radius:10px;color:var(--orange);font-size:14px;font-weight:600;text-decoration:none;}
.modal-phone:active{background:rgba(242,101,34,0.25);}
.modal-maps{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--teal-dim);border:1px solid var(--teal-border);border-radius:10px;color:var(--teal);font-size:13px;font-weight:600;text-decoration:none;}
.modal-maps:active{background:rgba(14,165,233,0.25);}
.site-addr-link{display:inline-flex;align-items:center;gap:5px;color:var(--teal);font-size:12px;font-weight:500;text-decoration:none;margin-bottom:12px;}
.site-addr-link:active{opacity:0.7;}
.modal-btns{display:flex;flex-direction:column;gap:8px;}
.modal-btn{padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:var(--hover-bg);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:inherit;}
.modal-btn:active{background:rgba(255,255,255,0.1);}
.modal-btn.sel{border-color:var(--teal);background:var(--teal-dim);color:var(--teal);}
.modal-btn .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.modal-cancel{padding:14px;border-radius:12px;border:none;background:rgba(255,255,255,0.06);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:8px;font-family:inherit;}
.swap-form{margin-top:12px;padding:14px;background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.2);border-radius:12px;}
.swap-form label{font-size:12px;color:var(--purple);font-weight:600;display:block;margin-bottom:8px;}
.swap-form input{width:100%;padding:12px;border-radius:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:var(--text);font-size:14px;font-family:inherit;margin-bottom:8px;}
.swap-form input::placeholder{color:var(--subtle);}
.swap-form .swap-btns{display:flex;gap:8px;}
.swap-form button{flex:1;padding:12px;border-radius:8px;background:var(--teal);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.swap-form button.swap-perm{background:var(--red);}
.search-wrap{position:relative;margin-bottom:16px;}
.search-input{width:100%;padding:14px 16px 14px 42px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:var(--text);font-size:15px;outline:none;font-family:inherit;}
.search-input:focus{border-color:var(--teal-border);}
.search-input::placeholder{color:var(--subtle);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:0.4;}
.result-card{padding:12px 14px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;margin-bottom:6px;cursor:pointer;}
.result-top{display:flex;justify-content:space-between;align-items:flex-start;}
.result-name{font-size:14px;font-weight:600;}
.result-date{font-size:10px;color:var(--orange);background:var(--orange-dim);padding:3px 8px;border-radius:6px;font-weight:600;flex-shrink:0;}
.result-unit{font-size:11px;color:var(--subtle);margin-top:4px;}
.result-campus{font-size:10px;color:var(--subtle);margin-top:2px;}
.filter-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.filter-modal{background:var(--navy-light);border-radius:20px 20px 0 0;padding:20px 20px 40px;width:100%;max-width:480px;max-height:70vh;overflow-y:auto;}
.filter-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;}
.filter-subtitle{font-size:12px;color:var(--subtle);margin-bottom:16px;}
.filter-item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:4px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.04);cursor:pointer;}
.filter-item:active{background:rgba(255,255,255,0.06);}
.filter-item .person-avatar{width:28px;height:28px;font-size:11px;}
.filter-item-name{font-size:13px;font-weight:500;flex:1;}
.filter-item-loc{font-size:10px;color:var(--subtle);}
.filter-close{padding:14px;border-radius:12px;border:none;background:rgba(255,255,255,0.06);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:12px;font-family:inherit;}
.filter-section{margin-bottom:16px;}
.filter-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:8px 0 6px;border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:8px;}
.stat-tap{cursor:pointer;padding:2px 6px;border-radius:6px;transition:background 0.15s;}
.stat-tap:active{background:rgba(255,255,255,0.1);}
.name-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(11,17,33,0.96);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;}
.name-box{width:100%;max-width:340px;text-align:center;}
.name-logo{font-size:11px;font-weight:600;letter-spacing:2px;color:var(--orange);text-transform:uppercase;margin-bottom:6px;}
.name-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px;}
.name-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.4;}
.name-input{width:100%;padding:15px 16px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid var(--teal-border);color:var(--text);font-size:16px;outline:none;font-family:inherit;text-align:center;margin-bottom:14px;}
.name-input:focus{border-color:var(--teal);}
.name-input::placeholder{color:var(--subtle);}
.name-btn{width:100%;padding:15px;border-radius:12px;background:var(--teal);border:none;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;}
.name-btn:active{opacity:0.85;}
</style>

function jsonp(url){
  return new Promise(function(resolve,reject){
    var cbName="__cb"+(jsonpId++);
    var timeout=setTimeout(function(){cleanup();reject(new Error("timeout"));},10000);
    function cleanup(){delete window[cbName];var s=document.getElementById(cbName);if(s)s.remove();clearTimeout(timeout);}
    window[cbName]=function(data){cleanup();resolve(data);};
    var s=document.createElement("script");s.id=cbName;
    s.src=url+(url.indexOf("?")>=0?"&":"?")+"callback="+cbName;
    s.onerror=function(){cleanup();reject(new Error("script error"));};
    document.body.appendChild(s);
  });
}

    statusSummary='<div style="font-size:10px;text-align:right;line-height:1.6">';
    if(presentC) statusSummary+='<span class="stat-tap" onclick="showFilter(\'present\')" style="color:#22c55e">'+presentC+' here</span><br>';
    if(missingC) statusSummary+='<span class="stat-tap" onclick="showFilter(\'missing\')" style="color:#ef4444">'+missingC+' missing</span><br>';
    if(leftC) statusSummary+='<span class="stat-tap" onclick="showFilter(\'left\')" style="color:#fbbf24">'+leftC+' left early</span><br>';
    if(swappedC) statusSummary+='<span class="stat-tap" onclick="showFilter(\'swapped\')" style="color:#a855f7">'+swappedC+' swapped</span>';
    statusSummary+='</div>';
  }

  // Filter popup (grouped by site + day/night)
  var filterHtml="";
  if(state.filterStatus){
    var fp=getFilteredPeople(state.filterStatus);
    var labels={present:"Present",missing:"Missing / No Show",left:"Left Early",swapped:"Swapped"};
    var colors={present:"#22c55e",missing:"#ef4444",left:"#fbbf24",swapped:"#a855f7"};
    var groups={};
    fp.forEach(function(r){var dn=isD(r.shift)?"Day":"Night";var key=r.site+"||"+dn;if(!groups[key])groups[key]={site:r.site,dn:dn,people:[]};groups[key].people.push(r);});
    var gkeys=Object.keys(groups).sort(function(a,b){var sa=groups[a].site,sb=groups[b].site;var ra=(sa in SITE_RANK)?SITE_RANK[sa]:50,rb=(sb in SITE_RANK)?SITE_RANK[sb]:50;if(ra!==rb)return ra-rb;return a.localeCompare(b);});
    filterHtml='<div class="filter-overlay" onclick="if(event.target===this)closeFilter()"><div class="filter-modal">'+
      '<div class="filter-title" style="color:'+colors[state.filterStatus]+'">'+labels[state.filterStatus]+' ('+fp.length+')</div>'+
      '<div class="filter-subtitle">'+fmtDate(state.date)+'</div>'+
      (fp.length===0?'<div style="padding:20px;text-align:center;color:#64748b">No one with this status</div>':"")+
      gkeys.map(function(k){var g=groups[k];var dnColor=g.dn==="Day"?"#F26522":"#818cf8";
        return '<div class="filter-section"><div class="filter-section-title"><span style="color:'+dnColor+'">'+g.site+' / '+g.dn+'</span> <span style="color:#64748b;font-weight:400">('+g.people.length+')</span></div>'+
          g.people.map(function(r){var hue2=h(r.name);
            return '<div class="filter-item" onclick="closeFilter();setState({site:\''+r.site.replace(/'/g,"\\'")+'\'});openModal(\''+state.date+"','"+r.site.replace(/'/g,"\\'")+"','"+r.unit.replace(/'/g,"\\'")+"','"+r.shift.replace(/'/g,"\\'")+"','"+r.person.replace(/'/g,"\\'")+'\')"><div class="person-avatar" style="background:hsl('+hue2+',45%,35%)">'+initials(r.name)+'</div><div style="flex:1;min-width:0"><div class="filter-item-name">'+r.name+'</div><div class="filter-item-loc">'+r.unit+'</div>'+(r.phone?'<div style="font-size:10px;color:#0EA5E9">\u{1F4F1} '+r.phone+'</div>':"")+'</div></div>';
          }).join("")+'</div>';
      }).join("")+
      '<button class="filter-close" onclick="closeFilter()">Close</button></div></div>';
  }

  // On-shift popup
  var onShiftHtml="";
  if(state.filterOnShift){
    var osp=getAllOnShift();var osG={};
    osp.forEach(function(r){var dn=isD(r.shift)?"Day Shift":"Night Shift";if(!osG[dn])osG[dn]=[];osG[dn].push(r);});
    onShiftHtml='<div class="filter-overlay" onclick="if(event.target===this)closeOnShift()"><div class="filter-modal">'+
      '<div class="filter-title" style="color:#F26522">On Shift ('+osp.length+')</div><div class="filter-subtitle">'+fmtDate(state.date)+' / '+state.site+'</div>'+
      (osp.length===0?'<div style="padding:20px;text-align:center;color:#64748b">No one on shift</div>':"")+
      ["Day Shift","Night Shift"].filter(function(dn){return osG[dn];}).map(function(dn){var dnColor=dn==="Day Shift"?"#F26522":"#818cf8";var ppl=osG[dn];
        return '<div class="filter-section"><div class="filter-section-title"><span style="color:'+dnColor+'">'+dn+'</span> <span style="color:#64748b;font-weight:400">('+ppl.length+')</span></div>'+
          ppl.map(function(r){var hue2=h(r.name);var rec2=getSt(state.date,r.site,r.unit,r.shift,r.person);var st2=rec2?rec2.status:null;var badge2=makeBadge(st2,rec2);
            return '<div class="filter-item" onclick="closeOnShift();openModal(\''+state.date+"','"+r.site.replace(/'/g,"\\'")+"','"+r.unit.replace(/'/g,"\\'")+"','"+r.shift.replace(/'/g,"\\'")+"','"+r.person.replace(/'/g,"\\'")+'\')"><div class="person-avatar" style="background:hsl('+hue2+',45%,35%)">'+initials(r.name)+'</div><div style="flex:1;min-width:0"><div class="filter-item-name">'+r.name+'</div><div class="filter-item-loc">'+r.unit+'</div>'+(r.phone?'<div style="font-size:10px;color:#0EA5E9">\u{1F4F1} '+r.phone+'</div>':"")+'</div>'+badge2+'</div>';
          }).join("")+'</div>';
      }).join("")+
      '<button class="filter-close" onclick="closeOnShift()">Close</button></div></div>';
  }

  // Modal
  var modalHtml="";
  if(state.modal){
    var m=state.modal;var rec=getSt(m.date,m.site,m.unit,m.shift,m.person);var curSt=rec?rec.status:null;
    var phone=getPhone(m.person);var mu=mapsUrl(m.site);var addr=getAddr(m.site);
    var chips="";
    if(phone)chips+='<a class="modal-phone" href="tel:'+phone.replace(/[^0-9+]/g,'')+'">\u{1F4F1} '+phone+'</a>';
    if(mu)chips+='<a class="modal-maps" href="'+mu+'" target="_blank" rel="noopener">\u{1F4CD} '+addr+'</a>';
    if(!phone&&!mu)chips='<div style="font-size:12px;color:#475569">No phone or address on file</div>';
    var checkinInfo="";
    if(curSt==="present"&&rec&&rec.checkins&&String(rec.checkins).indexOf(":")>=0){checkinInfo='<div style="font-size:11px;color:#94a3b8;padding:0 12px;margin-top:-4px;margin-bottom:4px">Checked in: '+rec.checkins+'</div>';}
    modalHtml='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+
      '<div class="modal-name">'+m.name+'</div><div class="modal-info">'+m.site+' / '+m.unit+' / '+m.shift+' / '+fmtDate(m.date)+'</div>'+
      '<div class="modal-chips">'+chips+'</div>'+
      '<div class="modal-btns">'+
        '<button class="modal-btn'+(curSt==="present"?" sel":"")+'" onclick="setStatusModal(\'present\')"><span class="dot" style="background:#22c55e"></span> '+(curSt==="present"&&rec&&rec.checkins?"Check In Again":"Present")+'</button>'+checkinInfo+
        '<button class="modal-btn'+(curSt==="missing"?" sel":"")+'" onclick="setStatusModal(\'missing\')"><span class="dot" style="background:#ef4444"></span> Missing / No Show</button>'+
        '<button class="modal-btn'+(curSt==="left"?" sel":"")+'" onclick="setStatusModal(\'left\')"><span class="dot" style="background:#fbbf24"></span> Left Early</button>'+
        '<button class="modal-btn'+(curSt==="removed"?" sel":"")+'" onclick="setStatusModal(\'removed\')"><span class="dot" style="background:#64748b"></span> Removed</button>'+
        '<button class="modal-btn'+(curSt==="swapped"?" sel":"")+'" onclick="state.showSwap=!state.showSwap;render()"><span class="dot" style="background:#a855f7"></span> Swap / Replace</button>'+
        (state.showSwap?'<div class="swap-form"><label>Who is replacing '+m.name+'?</label><input id="swapName" placeholder="Enter replacement name" value="'+(rec&&rec.replacedBy?rec.replacedBy:"")+'" /><div class="swap-btns"><button onclick="doSwap(false)">Today Only</button><button class="swap-perm" onclick="doSwap(true)">Rest of Project</button></div></div>':"")+
        '<button class="modal-btn" onclick="setStatusModal(null)"><span class="dot" style="background:#334155;border:1px solid #475569"></span> Clear Status</button>'+
      '</div><button class="modal-cancel" onclick="closeModal()">Cancel</button></div></div>';
  }

  var mainHtml='<div class="header"><div class="header-row"><div><div class="brand-sub">ReMedi \u2022 Henry Ford Go-Live</div><div class="brand-title">Provider Tracker</div><div style="margin-top:2px">'+syncLabel+(SHEET_URL?' <span style="font-size:9px;color:#475569;cursor:pointer" onclick="pullStatuses()">refresh</span>':"")+'</div><div style="margin-top:1px">'+managerLabel+'</div></div>'+
    '<div style="display:flex;gap:8px;align-items:center">'+statusSummary+'<div class="stat-box" onclick="showOnShift()"><div class="stat-num">'+total+'</div><div class="stat-label">On Shift</div></div></div></div></div>'+
    '<div class="date-scroll">'+DATES.map(function(d){var s=shortD(d);return '<button class="date-btn'+(d===state.date?" active":"")+'" onclick="setState({date:\''+d+'\'})"><div class="day">'+s.day+'</div><div class="num">'+s.num+'</div></button>';}).join("")+'</div>'+
    '<div class="site-scroll">'+availSites.map(function(s){return '<button class="site-btn'+(s===state.site?" active":"")+'" onclick="setState({site:\''+s.replace(/'/g,"\\'")+'\'})">'+s+'</button>';}).join("")+'</div>'+
    '<div class="controls-row"><div class="toggle-group"><button class="toggle-btn'+(state.view==="location"?" active":"")+'" onclick="setState({view:\'location\'})">Location</button><button class="toggle-btn'+(state.view==="search"?" active":"")+'" onclick="setState({view:\'search\'})">Search</button></div>'+
    '<div class="toggle-group shift-group"><button class="toggle-btn'+(state.shift==="all"?" active":"")+'" onclick="setState({shift:\'all\'})">All</button><button class="toggle-btn'+(state.shift==="day"?" active":"")+'" onclick="setState({shift:\'day\'})">Day</button><button class="toggle-btn'+(state.shift==="night"?" active":"")+'" onclick="setState({shift:\'night\'})">Night</button></div></div>';

  if(state.view==="location"){
    mainHtml+='<div class="content"><div class="content-label">'+fmtDate(state.date)+' / '+state.site+' / '+units.length+' units</div>';
    var siteMu=mapsUrl(state.site);
    if(siteMu)mainHtml+='<a class="site-addr-link" href="'+siteMu+'" target="_blank" rel="noopener">\u{1F4CD} '+getAddr(state.site)+' \u203A</a>';
    if(units.length===0){mainHtml+='<div class="empty-state"><div class="empty-icon">\u{1F4CB}</div><div class="empty-title">No assignments</div></div>';}
    else{
      mainHtml+='<div class="unit-list">';
      units.forEach(function(u){var isOpen=state.open===u.name;var pc=u.shifts.reduce(function(a,e){return a+e[1].people.length;},0);
        mainHtml+='<div class="unit-card'+(isOpen?" open":"")+'"><button class="unit-header" onclick="setState({open:state.open===\''+u.name.replace(/'/g,"\\'")+'\' ? null : \''+u.name.replace(/'/g,"\\'")+'\'})"><span class="unit-icon">'+(UNIT_ICONS[u.name]||"\u{1F3E5}")+'</span><div class="unit-info"><div class="unit-name">'+u.name+'</div><div class="unit-meta">'+pc+' staff</div></div><span class="unit-arrow">\u{203A}</span></button>';
        if(isOpen){mainHtml+='<div class="unit-body">';u.shifts.forEach(function(e){var sn=e[0],sd=e[1];var isDy=isD(sn);mainHtml+='<div class="shift-section"><div class="shift-header"><span class="shift-label '+(isDy?"day":"night")+'">'+(isDy?"DAY":"NIGHT")+'</span><span class="shift-time">'+sd.time+' ('+sd.people.length+')</span></div>';sd.people.forEach(function(p){mainHtml+=renderPerson(p,state.date,state.site,u.name,sn);});mainHtml+='</div>';});mainHtml+='</div>';}
        mainHtml+='</div>';
      });
      mainHtml+='</div>';
    }
    mainHtml+='</div>';
  }else{
    mainHtml+='<div class="content"><div class="search-wrap"><span class="search-icon">\u{1F50D}</span><input class="search-input" placeholder="Search by name..." value="'+state.search+'" oninput="setState({search:this.value})" autofocus></div>';
    if(state.search.length<2){mainHtml+='<div class="empty-state"><div class="empty-icon">\u{1F50D}</div><div class="empty-title">Type at least 2 characters</div></div>';}
    else{
      mainHtml+='<div class="content-label">'+searchRes.length+' results</div>';
      searchRes.slice(0,60).forEach(function(r){var stBadge2=r.status?'<span class="status-badge '+r.status+'" style="margin-top:4px;display:inline-block">'+(r.status==="left"?"Left Early":r.status==="swapped"?"Swapped":r.status.charAt(0).toUpperCase()+r.status.slice(1))+'</span>':"";
        mainHtml+='<div class="result-card" onclick="openModal(\''+r.date+"','"+r.site.replace(/'/g,"\\'")+"','"+r.unit.replace(/'/g,"\\'")+"','"+r.shift.replace(/'/g,"\\'")+"','"+r.person.replace(/'/g,"\\'")+'\')"><div class="result-top"><div class="result-name">'+r.name+'</div><div class="result-date">'+fmtDate(r.date)+'</div></div><div class="result-unit">'+r.site+' / '+r.unit+' / '+r.shift+'</div><div class="result-campus">'+(r.phone?'<span style="color:#0EA5E9;font-size:10px">\u{1F4F1} '+r.phone+'</span> ':"")+" "+stBadge2+'</div></div>';
      });
    }
    mainHtml+='</div>';
  }

  var nameModalHtml="";
  if(nameModalOpen){
    nameModalHtml='<div class="name-overlay"><div class="name-box">'+
      '<div class="name-logo">ReMedi \u2022 Henry Ford Go-Live</div>'+
      '<div class="name-title">Who are you?</div>'+
      '<div class="name-sub">Enter your name so we know who is tracking attendance. You will only be asked once on this device.</div>'+
      '<input class="name-input" id="nameInput" placeholder="Your name" value="'+(managerName?managerName:"")+'" autocomplete="name" onkeydown="if(event.key===\'Enter\'){submitName();}">'+
      '<button class="name-btn" onclick="submitName()">Continue</button>'+
    '</div></div>';
  }

  document.getElementById("app").innerHTML=mainHtml+onShiftHtml+filterHtml+modalHtml+nameModalHtml;
  if(nameModalOpen){var ni=document.getElementById("nameInput");if(ni&&document.activeElement!==ni){ni.focus();ni.setSelectionRange(ni.value.length,ni.value.length);}}
  if(state.view==="search"){var i=document.querySelector(".search-input");if(i&&document.activeElement!==i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
}
function setState(p){for(var k in p){state[k]=p[k];}render();}
render();
// Force name entry on open via in-app modal (works in iOS standalone, unlike prompt()).
if(!managerName){openNameModal();}
if(SHEET_URL)setInterval(function(){if(!nameModalOpen)pullStatuses();},30000);
</script>
</body>
</html>
